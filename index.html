<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fight the Landlord Elo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&display=swap">
<style>
:root{
  --bg:#eef3f0; --surface:#ffffff; --ink:#15231f; --muted:#5b6b65; --line:#cfdad4;
  --land:#b3261e; --land-soft:#f7e3e0; --peas:#8a5a0c; --peas-soft:#f6ecd5; --accent:#1f5c4d; --accent-ink:#ffffff;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1f1b; --surface:#172b26; --ink:#e6efe9; --muted:#9db0a8; --line:#294039;
    --land:#ee7466; --land-soft:#3a2420; --peas:#e0aa4c; --peas-soft:#3a3018; --accent:#6cc3a8; --accent-ink:#0f1f1b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1f1b; --surface:#172b26; --ink:#e6efe9; --muted:#9db0a8; --line:#294039;
  --land:#ee7466; --land-soft:#3a2420; --peas:#e0aa4c; --peas-soft:#3a3018; --accent:#6cc3a8; --accent-ink:#0f1f1b;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2{font-family:"Zilla Slab",Georgia,serif;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
header{margin-bottom:24px}
h1{font-size:clamp(28px,6vw,44px);font-weight:700;line-height:1.1}
header p{margin:8px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.grid{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}}
section,details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
h2{font-size:22px;font-weight:700;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
select,input[type=text],input[type=number],textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;padding:10px;text-align:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink);font-size:14px}
.seg input:checked + label.l{background:var(--land-soft);border-color:var(--land);color:var(--land);font-weight:600}
.seg input:checked + label.p{background:var(--peas-soft);border-color:var(--peas);color:var(--peas);font-weight:600}
.seg input:focus-visible + label{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;width:100%;margin-top:14px}
button:disabled{opacity:.5;cursor:not-allowed}
button.link{border:0;background:none;padding:2px 6px;color:var(--muted);text-decoration:underline}
.preview{margin-top:14px;padding:12px;border-radius:8px;background:var(--bg);font-size:14px;min-height:64px}
.bar{height:8px;border-radius:4px;background:var(--peas);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--land)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.row button{flex:0 0 auto}
.tablewrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right}
td.rating{font-family:"Zilla Slab",Georgia,serif;font-size:20px;font-weight:700}
.empty{color:var(--muted);padding:12px 0}
.up{color:var(--accent)} .down{color:var(--land)}
.hist{list-style:none;margin:0;padding:0}
.hist li{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:10px}
.tag.l{background:var(--land-soft);color:var(--land)} .tag.p{background:var(--peas-soft);color:var(--peas)}
.full{margin-top:16px}
details summary{cursor:pointer;font-family:"Zilla Slab",Georgia,serif;font-size:20px;font-weight:700}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
.hint{color:var(--muted);font-size:13px;margin:8px 0 0}
textarea{min-height:90px;font:12px/1.4 ui-monospace,Menlo,monospace}
.x{color:var(--muted);border:0;background:none;padding:0 4px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fight the Landlord ratings</h1>
    <p>An Elo rating for the three-player card game. One landlord plays against two peasants; every game moves each player’s rating.</p>
    <p class="hint" id="status" role="status"></p>
  </header>

  <div class="grid">
    <section aria-labelledby="h-log">
      <h2 id="h-log">Record a game</h2>
      <div id="logForm">
        <label for="selL">Landlord</label><select id="selL"></select>
        <label for="selA">Peasant</label><select id="selA"></select>
        <label for="selB">Peasant</label><select id="selB"></select>
        <label>Winner</label>
        <div class="seg">
          <input type="radio" name="w" id="wl" value="1" checked><label class="l" for="wl">Landlord won</label>
          <input type="radio" name="w" id="wp" value="0"><label class="p" for="wp">Peasants won</label>
        </div>
        <div class="preview" id="preview" aria-live="polite"></div>
        <button class="primary" id="record">Record game</button>
      </div>
    </section>

    <section aria-labelledby="h-board">
      <h2 id="h-board">Leaderboard</h2>
      <form class="row" id="addForm">
        <input type="text" id="newName" placeholder="Player name" maxlength="24" aria-label="New player name">
        <button type="submit">Add player</button>
      </form>
      <div class="tablewrap" id="board"></div>
    </section>
  </div>

  <section class="full" aria-labelledby="h-hist">
    <h2 id="h-hist">Recent games</h2>
    <ul class="hist" id="hist"></ul>
    <button class="link" id="undo">Undo last game</button>
  </section>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, addDoc, deleteDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* ====== PASTE YOUR FIREBASE DETAILS HERE (see setup steps) ====== */
const firebaseConfig = {
  apiKey: "AIzaSyB_Run2TYJi55vID0qQdZKfcDJZhXiDcj4",
  authDomain: "elo-system-b34ae.firebaseapp.com",
  projectId: "elo-system-b34ae",
  storageBucket: "elo-system-b34ae.firebasestorage.app",
  messagingSenderId: "166705652920",
  appId: "1:166705652920:web:c883f4f652be10d71c004d"
};
/* ================================================================ */

const DEF={start:500,scale:400,offset:0,kNew:40,kMid:24,kEst:16,prov:20,est:100};
const configured=!firebaseConfig.apiKey.startsWith("PASTE");
let db=null;
const S={players:[],ids:{},games:[],cfg:Object.assign({},DEF)};
let T={};

function $(id){return document.getElementById(id);}
function el(tag,txt,cls){var e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;return e;}
function sign(x){return(x>=0?"+":"\u2212")+Math.abs(x).toFixed(1);}
function pct(x){return Math.round(x*100)+"%";}
function setStatus(t,bad){var s=$("status");s.textContent=t;s.style.color=bad?"var(--land)":"var(--muted)";}

function kf(p,c){return p.g<c.prov?c.kNew:(p.g<c.est?c.kMid:c.kEst);}
function expected(rl,ra,rb,c){return 1/(1+Math.pow(10,((ra+rb)/2-(rl+c.offset))/c.scale));}
function calc(T,g,c){
  var L=T[g.l],A=T[g.a],B=T[g.b],e=expected(L.r,A.r,B.r,c),s=g.w?1:0;
  return {e:e,dl:kf(L,c)*(s-e),da:kf(A,c)*0.5*(e-s),db:kf(B,c)*0.5*(e-s)};
}
function replay(){
  var T={},c=S.cfg;
  S.players.forEach(function(n){T[n]={r:c.start,g:0,lg:0,lw:0,pg:0,pw:0};});
  S.games.forEach(function(g){
    g.res=null;
    if(!(T[g.l]&&T[g.a]&&T[g.b]))return;
    var x=calc(T,g,c);g.res=x;
    T[g.l].r+=x.dl;T[g.a].r+=x.da;T[g.b].r+=x.db;
    T[g.l].g++;T[g.l].lg++;if(g.w)T[g.l].lw++;
    [g.a,g.b].forEach(function(n){T[n].g++;T[n].pg++;if(!g.w)T[n].pw++;});
  });
  return T;
}

function fillSelects(){
  ["selL","selA","selB"].forEach(function(id,i){
    var s=$(id),cur=s.value;s.innerHTML="";
    S.players.forEach(function(n){var o=el("option",n);o.value=n;s.appendChild(o);});
    if(cur&&S.players.indexOf(cur)>=0)s.value=cur;else if(S.players[i])s.value=S.players[i];
  });
}
function renderPreview(){
  var p=$("preview"),btn=$("record");p.innerHTML="";
  if(!db){btn.disabled=true;p.textContent="Connect the database to record games.";return;}
  if(S.players.length<3){btn.disabled=true;p.textContent="Add at least three players to record a game.";return;}
  var l=$("selL").value,a=$("selA").value,b=$("selB").value;
  if(l===a||l===b||a===b){btn.disabled=true;p.textContent="Pick three different players.";return;}
  btn.disabled=false;
  var g={l:l,a:a,b:b,w:$("wl").checked},x=calc(T,g,S.cfg);
  p.appendChild(el("div",l+" is expected to win "+pct(x.e)+" of the time."));
  var bar=el("div",null,"bar"),i=el("i");i.style.width=(x.e*100)+"%";bar.appendChild(i);p.appendChild(bar);
  p.appendChild(el("div","If recorded: "+l+" "+sign(x.dl)+", "+a+" "+sign(x.da)+", "+b+" "+sign(x.db)));
}
function renderBoard(){
  var b=$("board");b.innerHTML="";
  if(!S.players.length){b.appendChild(el("p","No players yet. Add the names of everyone who plays.","empty"));return;}
  var rows=S.players.slice().sort(function(x,y){return T[y].r-T[x].r;});
  var t=el("table"),h=el("tr");
  ["#","Player","Rating","Games","As landlord","As peasant",""].forEach(function(x,i){var th=el("th",x);if(i==2||i==3)th.className="num";h.appendChild(th);});
  t.appendChild(h);
  rows.forEach(function(n,i){
    var p=T[n],r=el("tr");
    r.appendChild(el("td",i+1));r.appendChild(el("td",n));
    r.appendChild(el("td",Math.round(p.r),"num rating"));r.appendChild(el("td",p.g,"num"));
    r.appendChild(el("td",p.lg?p.lw+"\u2013"+(p.lg-p.lw)+" ("+pct(p.lw/p.lg)+")":"\u2013"));
    r.appendChild(el("td",p.pg?p.pw+"\u2013"+(p.pg-p.pw)+" ("+pct(p.pw/p.pg)+")":"\u2013"));
    var td=el("td");
    if(!p.g&&db){var x=el("button","\u00d7","x");x.title="Remove "+n;x.setAttribute("aria-label","Remove "+n);x.onclick=function(){deleteDoc(doc(db,"players",S.ids[n])).catch(fail);};td.appendChild(x);}
    r.appendChild(td);t.appendChild(r);
  });
  b.appendChild(t);
}
function renderHist(){
  var u=$("hist");u.innerHTML="";
  var gs=S.games.slice(-15).reverse();
  $("undo").style.display=(gs.length&&db)?"":"none";
  if(!gs.length){u.appendChild(el("li","No games recorded yet.","empty"));return;}
  gs.forEach(function(g){
    var li=el("li"),r=g.res;
    li.appendChild(el("span",g.w?"Landlord won":"Peasants won","tag "+(g.w?"l":"p")));
    li.appendChild(document.createTextNode(" "+g.l+" (landlord) vs "+g.a+" and "+g.b+". "));
    if(r)li.appendChild(el("span",sign(r.dl)+" / "+sign(r.da)+" / "+sign(r.db)));
    u.appendChild(li);
  });
}
function refresh(){T=replay();fillSelects();renderBoard();renderHist();renderPreview();}
function fail(e){setStatus("Couldn\u2019t save: "+e.message,true);}

$("addForm").onsubmit=function(e){
  e.preventDefault();
  var n=$("newName").value.trim();
  if(!n||!db)return;
  var id=n.toLowerCase().replace(/[\/\s]+/g,"_");
  if(S.players.some(function(p){return p.toLowerCase()===n.toLowerCase();})){$("newName").value="";return;}
  setDoc(doc(db,"players",id),{name:n,t:serverTimestamp()}).catch(fail);
  $("newName").value="";
};
$("record").onclick=function(){
  if(!db)return;
  addDoc(collection(db,"games"),{l:$("selL").value,a:$("selA").value,b:$("selB").value,w:$("wl").checked,t:serverTimestamp()}).catch(fail);
};
$("undo").onclick=function(){
  var g=S.games[S.games.length-1];
  if(g&&db)deleteDoc(doc(db,"games",g.id)).catch(fail);
};
["selL","selA","selB","wl","wp"].forEach(function(id){$(id).addEventListener("change",renderPreview);});

if(configured){
  db=getFirestore(initializeApp(firebaseConfig));
  setStatus("Connecting\u2026");
  onSnapshot(query(collection(db,"players"),orderBy("t")),function(snap){
    S.players=[];S.ids={};
    snap.forEach(function(d){var n=d.data().name;S.players.push(n);S.ids[n]=d.id;});
    refresh();setStatus("Live: everyone sees the same leaderboard.");
  },function(e){setStatus("Couldn\u2019t load players: "+e.message,true);});
  onSnapshot(query(collection(db,"games"),orderBy("t")),function(snap){
    S.games=snap.docs.map(function(d){var x=d.data();return{id:d.id,l:x.l,a:x.a,b:x.b,w:x.w};});
    refresh();
  },function(e){setStatus("Couldn\u2019t load games: "+e.message,true);});
}else{
  setStatus("The database isn\u2019t connected yet. Follow the setup steps, then paste your Firebase details at the top of the script in this file.",true);
}
refresh();
</script>
</body>
</html>
